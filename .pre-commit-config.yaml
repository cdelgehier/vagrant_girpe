repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: commitizen
        name: Commitizen
        entry: uv run --locked cz check --commit-msg-file
        language: system
        stages: [commit-msg]

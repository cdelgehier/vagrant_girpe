[project]
name = "vagrant-girpe"
version = "0.0.0"
description = "A GIRPE2 Windows lab on Apple Silicon."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.15.15", "ty>=0.0.1", "smbprotocol>=1.15.0", "pre-commit>=4.0", "commitizen>=4.16.3"]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/test_package.py"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
version_files = ["pyproject.toml:^version"]
pre_bump_hooks = ["uv lock"]
